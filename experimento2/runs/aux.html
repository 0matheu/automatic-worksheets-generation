<!DOCTYPE html>
<html lang="en">
  <head></head>
  <style>
    /* class that will be used to describe the layout of the activity, in this case containing three images in a 2-line and 2-column layout */
    .container {
      display: grid;
      grid-template-columns: 300px 300px;
      grid-template-rows: 300px 300px;
      grid-template-areas:
        "child img1"
        "child img2";
    }

    /* class used to place the image of the child in the middle of the first and second rows of the first column */
    .child {
      grid-area: child;
      width: 300px;
      height: 600px;
    }

    /* class used to place the image in the middle of the first and second rows */
    .child img{
      margin-top: 180px;
    }

    /* image to give the images the correct size */
    img {
      width: 230px;
      height: 230px;
    }

    /* class used to place the img1 on the first row of the second column */
    .img1 {
      grid-area: img1;
    }

    /* class used to place the img2 on the second row of the second column */
    .img2 {
      grid-area: img2;
    }
  </style>
  <body>
    <div
      style="width: 600px; border: solid 1px"
      exp="div containing the sheet width, which in this case is 600px"
    >
      <div class="activity" style="width: 600px">
        <p
          exp="Activity description, containing the explanation of what the student will have to do to answer the activity correctly"
        >
        Observe the images below. Manuel has 3 toy cars. Connect the image of Manuel to the set of toy cars with the most cars. Then, write in the box the sum of the toy cars Manuel has, with the toy cars linked.
        </p>

        <div class="container">
          <div class="child" exp="div used to adjust the image of the child on the middle of first and second rows, and the first column">
            <img
              class=""
              src=""
              alt="image of a child with 3 toy cars"
              exp="image that the student will have to look at and identify that there are 3 toy cars with the child"
            />
          </div>

          <div class="img1" exp="div used to adjust the image of the set of toy cars on first row, and the second column">
            <img
              class=""
              src=""
              alt="image of 5 toy cars"
              exp="image that the student will have to look at and identify that there are 5 toy cars"
            />
          </div>

          <div class="img2" exp="div used to adjust the image of the set of toy cars on second row, and the second column">
            <img
              class=""
              src=""
              alt="image of 6 toy cars"
              exp="image that the student will have to look at and identify that there are 6 toy cars"
            />
          </div>
        </div>

        <p
          exp="description of where the student will write the answer"
          style="text-align: center; margin-top: 20px;"
        >
          Write in the box below the total number of toy cars after linking the images:
        </p>
        <div style="display: flex; justify-content: center;" exp="div used to center the answer box">
          <div
            style="width: 100px; height: 100px; border: 1px solid black;"
            exp="box used by the student to write the answer, in that case 8"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
