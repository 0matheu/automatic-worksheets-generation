<!DOCTYPE html>

  <head></head>
  <body>
    <div
      style="width: 700px; border: solid 1px; padding: 10px; text-align: left;"
      exp="Esta div atua como o contêiner principal da atividade. Define uma largura fixa de 700px com preenchimento interno."
    >
      <div class="activity" style="width: 700px;">
        <p
          exp="Este parágrafo fornece uma descrição clara da tarefa. O aluno precisa calcular o número total de lanches consumidos somando os números fornecidos."
        >
          Duas crianças comeram lanches. A primeira criança comeu 4 lanches. A segunda criança comeu a mesma quantidade. Quantos lanches foram consumidos no total?
        </p>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="Esta seção contém uma ilustração relacionada ao problema para tornar a atividade mais envolvente para o aluno."

          <img
            src=""
            alt="Ilustração de duas crianças com balões de fala, cada uma segurando uma bandeja com 4 lanches. No estilo de um livro para colorir."
            style="width: 300px; height: auto;"
            exp="Esta imagem representa visualmente o cenário onde duas crianças consumiram um número igual de lanches."
          />
        </div>

        <p>Escreva na caixa abaixo o número total de lanches consumidos.</p>
        <div
          style="width: 100px; height: 100px; border: 1px solid black; margin: 10px auto;"
          exp="Esta caixa está centralizada e é usada para o aluno escrever o número total de lanches consumidos. A resposta correta é '8'."
        >
        </div>
      </div>
