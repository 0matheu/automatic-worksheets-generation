<!DOCTYPE html>
<html lang="pt">
  <head></head>
  <body>
    <div
      style="width: 700px; border: solid 1px; padding: 10px; text-align: center;"
      exp="Esta div atua como o contêiner principal da atividade. Define uma largura fixa de 700px com preenchimento interno e centraliza o conteúdo."
    >
      <div class="activity" style="width: 100%;">
        <p
          exp="Este parágrafo fornece uma descrição clara da tarefa. Ele instrui o aluno a analisar a imagem e calcular o número total de sanduíches e caixinhas de suco."
        >
          Observe a imagem abaixo e responda às seguintes perguntas:
        </p>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="Esta div usa flexbox para centralizar horizontalmente a imagem da atividade."
        >
          <img
            src=""
            alt="Imagem mostrando Maria com 3 sanduíches e 2 caixinhas de suco. No estilo de um livro para colorir."
            style="width: 400px; height: auto;"
            exp="Esta imagem exibe Maria com seus lanches e é usada para que o aluno conte e calcule o número total de itens."
          />
        </div>

        <div
          style="text-align: left; margin-top: 20px;"
          exp="Esta seção fornece instruções para escrever as respostas abaixo de cada pergunta."
        >
          <div style="margin-bottom: 10px;">
            <p style="display: inline-block; margin-right: 10px;">A) Quantos sanduíches Maria tem?</p>
            <div
              style="width: 100px; height: 30px; border: 1px solid black; display: inline-block; text-align: center;"
              exp="Caixa onde o aluno escreve o número total de sanduíches. A resposta correta é '6'."
            ></div>
          </div>

          <div>
            <p style="display: inline-block; margin-right: 10px;">B) Quantas caixinhas de suco Maria tem?</p>
            <div
              style="width: 100px; height: 30px; border: 1px solid black; display: inline-block; text-align: center;"
              exp="Caixa onde o aluno escreve o número total de caixinhas de suco. A resposta correta é '3'."
            ></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
