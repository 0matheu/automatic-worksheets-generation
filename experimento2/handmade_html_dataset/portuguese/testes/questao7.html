<!DOCTYPE html>
<html lang="pt">
  <head></head>
  <body>
    <div
      style="width: 600px; border: solid 1px; padding: 10px; text-align: center;"
      exp="Esta div atua como o contêiner principal da atividade. Define uma largura fixa de 600px com preenchimento interno e centraliza o conteúdo."
    >
      <div class="activity" style="width: 100%;">
        <p
          exp="Este parágrafo fornece uma descrição clara da tarefa. O aluno precisa resolver a equação e associá-la ao resultado correto."
        >
          Resolva a soma abaixo e associe-a ao resultado correto:
        </p>

        <div
          style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;"
          exp="Esta seção contém a equação e as opções para o aluno associar ao resultado correto."
        >
          <p style="margin: 0 10px; font-size: 20px;">
            25 + 9 = 
            <span
              style="display: inline-block; border: 1px solid black; width: 50px; height: 30px;"
              exp="Este é o espaço onde o aluno escreverá o resultado da soma. A resposta correta é 34."
            ></span>
          </p>

          <div
            style="display: flex; flex-direction: column; align-items: center; margin-left: 10px;"
            exp="Esta seção contém as opções para o aluno associar ao resultado da soma. A resposta correta é 34."
          >
            <div
              style="width: 60px; height: 30px; border: 1px solid black; display: flex; justify-content: center; align-items: center; margin-bottom: 5px;"
              exp="Opção 1. Incorreta. O aluno deve associar o resultado ao numeral correto."
            >
              <p style="margin: 0;">32</p>
            </div>
            <div
              style="width: 60px; height: 30px; border: 1px solid black; display: flex; justify-content: center; align-items: center; margin-bottom: 5px;"
              exp="Opção 2. Correta. O aluno deve associar o resultado ao numeral correto."
            >
              <p style="margin: 0;">34</p>
            </div>
            <div
              style="width: 60px; height: 30px; border: 1px solid black; display: flex; justify-content: center; align-items: center;"
              exp="Opção 3. Incorreta. O aluno deve associar o resultado ao numeral correto."
            >
              <p style="margin: 0;">36</p>
            </div>
          </div>
        </div>

        <div
          style="text-align: left; margin-bottom: 20px;"
          exp="Esta seção fornece instruções para o aluno observar a imagem."
        >
          <p>Observe a imagem abaixo e descreva o que você vê:</p>
        </div>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="Esta seção contém a imagem que o aluno descreverá."
        >
          <img
            src=""
            alt="Uma cena subaquática com um peixe e um cavalo-marinho. No estilo de um livro para colorir."
            style="width: 300px; height: auto;"
            exp="Esta imagem mostra um peixe e um cavalo-marinho em uma cena subaquática. O aluno deve descrever o que vê na imagem."
          />
        </div>
      </div>
    </div>
  </body>
</html>
