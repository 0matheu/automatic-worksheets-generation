<!DOCTYPE html>
<html lang="pt">
  <head></head>
  <body>
    <div
      style="width: 700px; border: solid 1px; padding: 10px; text-align: center;"
      exp="Este contêiner organiza o layout da atividade, incluindo o tema de lanches."
    >
      <div class="activity" exp="Esta div contém o conteúdo principal da atividade.">
        <p
          exp="Este parágrafo fornece instruções para o aluno calcular o número total de lanches que Ana e Maria comeram, somando os números fornecidos."
        >
          Ana comeu 4 lanches, e Maria comeu 5 lanches. Quantos lanches elas
          comeram no total?
        </p>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="Esta seção contém uma imagem relacionada ao contexto do problema."
        >
          <img
            src=""
            alt="Ilustração de Ana e Maria com uma mesa contendo 4 lanches e 5 lanches."
            style="width: 300px; height: auto;"
            exp="Esta imagem representa visualmente o cenário em que Ana e Maria consumiram uma determinada quantidade de lanches."
          />
        </div>

        <p exp="Este parágrafo solicita ao aluno que forneça o número total de lanches consumidos.">
          Escreva o número total de lanches na caixa abaixo:
        </p>
        <div
          style="width: 100px; height: 100px; border: 1px solid black; margin: 10px auto;"
          exp="Esta caixa está centralizada e é usada para o aluno escrever o número total de lanches que Ana e Maria comeram. A resposta correta é '9'."
        ></div>
      </div>
    </div>
  </body>
