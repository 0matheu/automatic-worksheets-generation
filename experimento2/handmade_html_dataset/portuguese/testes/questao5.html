<!DOCTYPE html>
<html lang="pt">
  <head></head>
  <body>
    <div
      style="width: 600px; border: solid 1px; padding: 10px; text-align: center;"
      exp="Esta div atua como o contêiner principal da atividade. Define uma largura fixa de 600px com preenchimento interno e centraliza o conteúdo."
    >
      <div class="activity" style="width: 600px;">
        <p
          exp="Este parágrafo fornece uma descrição clara da tarefa. O aluno precisa calcular o número total de carrinhos de brinquedo somando os números fornecidos."
        >
          Aline e Pedro estão brincando com carrinhos de brinquedo. Aline tem 15 carrinhos e Pedro tem 10 carrinhos. Quantos carrinhos de brinquedo eles têm no total? Calcule e escreva a resposta na caixa abaixo.
        </p>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="Esta seção contém uma ilustração relacionada ao problema para tornar a atividade mais envolvente para o aluno."
        >
          <img
            src=""
            alt="Ilustração de Aline e Pedro com carrinhos de brinquedo"
            style="width: 300px; height: auto;"
            exp="Esta imagem representa visualmente o cenário onde dois amigos têm carrinhos de brinquedo, incentivando o aluno a somá-los."
          />
        </div>

        <div style="display: flex; justify-content: space-around;">
          <div style="text-align: center;">
            <img
              src=""
              alt="Imagem de 15 carrinhos de brinquedo"
              style="width: 150px; height: auto;"
              exp="Esta imagem mostra uma coleção de 15 carrinhos de brinquedo com a quantidade indicada. O aluno deve identificar e somar este grupo."
            />
          </div>

          <div style="text-align: center;">
            <img
              src=""
              alt="Imagem de 10 carrinhos de brinquedo"
              style="width: 150px; height: auto;"
              exp="Esta imagem mostra uma coleção de 10 carrinhos de brinquedo com a quantidade indicada. O aluno deve identificar e somar este grupo."
            />
          </div>
        </div>

        <p exp="Texto de instrução para o aluno escrever o número total de carrinhos de brinquedo.">
          Escreva o número total de carrinhos de brinquedo na caixa abaixo:
        </p>
        <div
          style="width: 100px; height: 100px; border: 1px solid black; margin: 10px auto 0;"
          exp="Esta caixa está centralizada e é usada para o aluno escrever o número total de carrinhos de brinquedo. A resposta correta é 25."
        ></div>
      </div>
    </div>
  </body>
</html>
