<!DOCTYPE html>
<html lang="pt">
  <head></head>
  <body>
    <div
      style="width: 800px; border: solid 1px; padding: 10px; text-align: center;"
      exp="Esta div atua como o contêiner principal da atividade. Define uma largura fixa de 800px com preenchimento interno e centraliza o conteúdo."
    >
      <div class="activity" style="width: 100%;">
        <p
          exp="Este parágrafo fornece uma descrição clara da tarefa. O aluno precisa resolver a subtração e associá-la ao numeral correto."
        >
          Resolva a subtração abaixo e associe-a ao resultado correto:
        </p>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="Esta div contém a ilustração principal e garante que ela esteja centralizada dentro do layout da atividade."
        >
          <img
            src=""
            alt="Ilustração de fogos de artifício no céu noturno, com os números 68 e 28 visíveis nos fogos de artifício."
            style="width: 400px; height: auto;"
            exp="Esta imagem representa visualmente o tema dos fogos de artifício e inclui os números 68 e 28 para contextualizar o problema de subtração."
          />
        </div>

        <div
          style="text-align: left; margin-bottom: 20px;"
          exp="Esta seção fornece as opções de resposta para o aluno associar ao resultado correto."
        >
          <p>Escolha entre as opções abaixo:</p>
          <div style="display: flex; align-items: center; margin-top: 10px;">
            <p style="margin-right: 10px;">A) 39</p>
            <p style="margin-right: 10px;">B) 41</p>
            <p style="margin-right: 10px;">C) 40</p>
          </div>
        </div>

        <p exp="Este parágrafo instrui o aluno a escrever a resposta correta abaixo do resultado da subtração. A resposta correta é 40." style="text-align: left;">
          Escreva o resultado correto na caixa abaixo:
        </p>
        <div
          style="width: 100px; height: 50px; border: 1px solid black; margin: 10px auto 0;"
          exp="Esta div contém uma caixa onde o aluno escreverá o resultado da subtração. A resposta correta é 40."
        ></div>
      </div>
    </div>
  </body>
</html>
