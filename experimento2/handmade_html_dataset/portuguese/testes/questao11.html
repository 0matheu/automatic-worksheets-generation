<!DOCTYPE html>
<html lang="pt">
  <head></head>
  <body>
    <div
      style="width: 800px; border: solid 1px; padding: 10px; text-align: center;"
      exp="Este contêiner organiza o layout da atividade, incluindo o tema dos fogos de artifício."
    >
      <div class="activity" exp="Esta div contém o conteúdo principal da atividade.">
        <p
          exp="Este parágrafo fornece instruções para o aluno calcular o número total de fogos de artifício lançados, somando os números fornecidos."
        >
          A celebração do Ano Novo no Rio de Janeiro incluiu o lançamento de
          9.587 fogos de artifício. Sydney lançou 8.912 fogos de artifício em sua celebração de Ano Novo. Quantos fogos de artifício foram lançados no total nas duas cidades?
        </p>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="Esta seção contém uma imagem relacionada ao tema dos fogos de artifício."
        >
          <img
            src=""
            alt="Um desenho de fogos de artifício no céu noturno."
            style="width: 400px; height: auto;"
            exp="Esta imagem representa visualmente o tema dos fogos de artifício da atividade."
          />
        </div>

        <p exp="Este parágrafo orienta o aluno a fornecer o número total de fogos de artifício lançados.">
          Escreva o total de fogos de artifício lançados na caixa abaixo.
        </p>
        <div
          style="width: 100px; height: 100px; border: 1px solid black; margin: 10px auto;"
          exp="Esta caixa é usada para o aluno escrever o número total de fogos de artifício lançados. A resposta correta é '18.499 fogos de artifício.'"
        ></div>
      </div>
    </div>
  </body>
</html>
