<!DOCTYPE html>
<html lang="en">
  <head></head>
  <body>
    <div
      style="width: 600px; border: solid 1px; padding: 10px; text-align: left;"
      exp="This div acts as the main container for the activity. It sets a fixed width of 600px with padding for spacing inside."
    >
      <div class="activity" style="width: 600px;">
        <p
          exp="This paragraph provides a clear description of the task. The student needs to calculate the total number of toy cars Sam has by adding the given numbers."
        >
          Sam received 3 toy cars from his first friend and 3 toy cars from his
          second friend. How many toy cars does Sam have in total? Add the
          numbers and write the total in the box below.
        </p>

        <div
          style="display: flex; justify-content: center; margin-bottom: 20px;"
          exp="This section contains visual representations related to the problem to make the activity more engaging for the student."
        >
          <img
            src=""
            alt="Illustration of 3 toy cars received from the first friend"
            style="width: 200px; height: auto; margin-right: 10px;"
            exp="This image visually represents the 3 toy cars Sam received from his first friend."
          />
          <img
            src=""
            alt="Illustration of 3 toy cars received from the second friend"
            style="width: 200px; height: auto;"
            exp="This image visually represents the 3 toy cars Sam received from his second friend."
          />
        </div>

        <p>Write the total number of toy cars in the box below:</p>
        <div
          style="width: 100px; height: 100px; border: 1px solid black; margin: 10px auto;"
          exp="This box is centered and used for the student to write the total number of toy cars Sam has. The correct answer is '6 toy cars.'"
        ></div>
      </div>
    </div>
  </body>
</html>
