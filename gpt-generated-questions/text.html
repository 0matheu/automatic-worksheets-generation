<html lang="en">
  <head></head>
  <style>
    /* class that will be used to describe the layout of the activity, in this case containing three images in a 2-line and 3-column layout */
    .container {
      display: grid;
      grid-template-columns: 200px 200px 200px;
      grid-template-rows: 200px 200px;
      grid-template-areas:
        "img1 img2 img3"
        "img4 img4 img4";
    }

    /* class used to place the first image of the toy cars in the first row and the first column*/
    .img1 {
      grid-area: img1;
    }

    /* class used to place the second image of the toy cars in the first row and the second column*/
    .img2 {
      grid-area: img2;
    }

    /* class used to place the third image of the toy cars in the first row and the third column*/
    .img3 {
      grid-area: img3;
    }

    /* class used to place the fourth image of the toy cars in the second row and the first column*/
    .img4 {
      grid-area: img4;
    }
    
    /* class used to adjust the size of the images in the activity, being 150px by 150px */
    img {
      width: 150px;
      height: 150px;
    }
  </style>
  <body>
    <div
      style="width: 600px; border: solid 1px"
      exp="div containing the sheet width, which in this case is 600px"
    >
      <div class="question" exp="div containing the question description">
        <p
          exp="Question description, containing the explanation of what the student will have to do to answer the question correctly"
        >
          Observe the images below, connect the two images with the largest
          quantity of toy cars, then write the sum of all the toy cars of the
          two linked images.
        </p>

        <div class="container">
          <div class="img1">
            <img
              alt="image in a children's drawing style containing 5 toy cars in a parking lot"
              exp="image in which the student will have to identify that there are 5 toy cars, being the image with the largest quantity of cars, and connect with img3"
            />
          </div>

          <div class="img2">
            <img
              alt="image in a children's drawing style containing 2 toy cars in a parking lot"
              exp="image in which the student will have to identify that there are 2 toy cars, NOT being the image with the largest quantity of cars"
            />
          </div>

          <div class="img3">
            <img
              alt="image in a children's drawing style containing 6 toy cars in a parking lot"
              exp="image in which the student will have to identify that there are 6 toy cars, being the image with the largest quantity of cars, and connect with img1"
            />
          </div>

          <div class="img4">
            <img
              alt="image in a children's drawing style containing 3 toy cars in a parking lot"
              exp="image in which the student will have to identify that there are 3 toy cars, NOT being the image with the largest quantity of cars"
            />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
