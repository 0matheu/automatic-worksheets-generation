<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <div style="width: 800px; border: 1px solid black; padding: 16px;" exp="Contêiner principal estruturado para a atividade visual, garantindo que tudo seja fácil de ler e usar.">

      <p exp="Instrução que introduz o tema do parquinho. Os alunos devem contar os escorregadores em dois parquinhos.">
        Observe os parquinhos. Conte quantos escorregadores você vê no Parquinho A e no Parquinho B.
      </p>

      <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 16px;" exp="Contêiner alinhado horizontalmente para comparar as imagens do Parquinho A e Parquinho B lado a lado.">
        <div>
          <img src="" alt="Parquinho A com 4 escorregadores." style="width: 350px; height: 250px;" exp="Imagem mostrando o Parquinho A. Os alunos devem contar visualmente o número de escorregadores nesta imagem.">
          <p style="text-align: center;" exp="Rótulo identificando a primeira imagem como Parquinho A.">Parquinho A</p>
        </div>
        <div>
          <img src="" alt="Parquinho B com 6 escorregadores." style="width: 350px; height: 250px;" exp="Imagem do Parquinho B onde o número de escorregadores provavelmente será diferente da primeira.">
          <p style="text-align: center;" exp="Rótulo marcando a segunda imagem como Parquinho B.">Parquinho B</p>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between;" exp="Linha para a primeira pergunta. Os alunos contarão e registrarão os escorregadores da primeira imagem.">
        <p exp="Pergunta A pede o número de escorregadores visíveis no Parquinho A."><b>A)</b> Quantos escorregadores há no Parquinho A?</p>
        <div style="width: 100px; height: 40px; border: 1px solid black;" exp="Caixa de resposta para o Parquinho A. O aluno escreve aqui o número de escorregadores."></div>
      </div>

      <div style="display: flex; justify-content: space-between;" exp="Linha para a segunda pergunta sobre o Parquinho B.">
        <p exp="Pergunta B pede o número de escorregadores no Parquinho B."><b>B)</b> Quantos escorregadores há no Parquinho B?</p>
        <div style="width: 100px; height: 40px; border: 1px solid black;" exp="Caixa de resposta para o Parquinho B. O aluno registra aqui a contagem."></div>
      </div>

    </div>
  </body>
</html>
