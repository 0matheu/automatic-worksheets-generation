<html>
  <head></head>
  <body>
    <div style="width: 600px; border: solid 1px">
      <div
        class="activity"
        style="width: 600px"
        exp="div que contém a largura da página, que neste caso é 600px"
      >
        <p
          exp="Descrição da atividade, contendo a explicação do que o aluno terá que fazer para responder corretamente"
        >
          Observe a tabela abaixo, realize a adição dos números e escreva o resultado.
        </p>
        <div style="display: flex; justify-content: center;">
          <table
            style="border: 1px solid black; width: 90%; text-align: center; margin-bottom: 20px;"
            exp="tabela que conterá as adições a serem realizadas"
          >
            <tr
              exp="Cabeçalho da tabela, que contém duas colunas, uma indicando a coluna com as equações e a outra indicando a coluna de resultados"
            >
              <th style="border-bottom: 1px solid black;">Adição</th>
              <th style="border-bottom: 1px solid black;">Resultado</th>
            </tr>
            <tr>
              <td
                exp="Adição que o aluno terá que realizar, devendo escrever o resultado após o sinal de igual"
              >
                4 + 5 =
              </td>
              <td style="border: 1px solid black;"></td>
            </tr>
            <tr>
              <td
                exp="Adição que o aluno terá que realizar, devendo escrever o resultado após o sinal de igual"
              >
                15 + 8 =
              </td>
              <td style="border: 1px solid black;"></td>
            </tr>
            <tr>
              <td
                exp="Adição que o aluno terá que realizar, devendo escrever o resultado após o sinal de igual"
              >
                8 + 23 =
              </td>
              <td style="border: 1px solid black;"></td>
            </tr>
          </table>
        </div>
        <p exp="descrição de onde o aluno deverá escrever a resposta" style="text-align: center;">
          Na tabela chamada "Resultado", inclua a soma correspondente ao lado de cada equação.
        </p>        
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
